services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - finops_network

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./mongodb/replica-set-init/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"
    networks:
      - finops_network

  migration:
    build:
      context: ./backend
    environment:
      MONGODB_URI: "mongodb://mongodb:27017/finops_enterprise?replicaSet=rs0"
      MONGODB_DB_NAME: "finops_enterprise"
    command: ["node", "scripts/migrate-json-to-mongodb.js"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - finops_network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      FRONTEND_ORIGIN: "http://localhost:8080"
      MONGODB_URI: "mongodb://mongodb:27017/finops_enterprise?replicaSet=rs0"
      MONGODB_DB_NAME: "finops_enterprise"
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - finops_network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - finops_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - finops_network

volumes:
  mongodb_data:

networks:
  finops_network:
    driver: bridge